name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  edge-functions:
    name: Edge Functions (Deno)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Formatação
        run: deno fmt --check supabase/functions scripts

      - name: Lint
        run: deno lint supabase/functions scripts

      - name: Type-check
        run: deno check supabase/functions/*/index.ts scripts/*.ts

      # --allow-env: os testes de CORS mexem em ALLOWED_ORIGINS.
      - name: Testes unitários
        run: deno test --allow-env supabase/functions/_shared/

  web:
    name: App web (build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Instalar dependências
        run: npm ci --prefix web

      - name: Type-check
        run: npm run typecheck --prefix web

      # O mesmo comando que a Vercel roda: se quebrar aqui, quebra lá.
      - name: Build
        env:
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_ANON_KEY: ci-placeholder
        run: npm run build --prefix web

  database:
    name: Banco (migrations + fluxo da fila)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: neqst
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Instalar psql
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Migrations + testes funcionais
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/neqst
        run: scripts/test-sql.sh

      - name: db/full_setup.sql está em dia com as migrations
        run: |
          scripts/build-full-setup.sh
          git diff --exit-code db/full_setup.sql \
            || { echo "::error::db/full_setup.sql desatualizado — rode scripts/build-full-setup.sh"; exit 1; }
