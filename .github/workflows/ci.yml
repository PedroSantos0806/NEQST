name: CI

on:
  push:
    branches: ["**"]
  pull_request:

# Os três jobs só leem o repositório. Sem esta linha, o workflow herda o
# padrão do repositório — que pode incluir escrita em conteúdo, pacotes e
# pull requests, tudo disponível para qualquer action de terceiro que
# rode aqui.
permissions:
  contents: read

jobs:
  edge-functions:
    name: Edge Functions (Deno)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Formatação
        run: deno fmt --check supabase/functions scripts

      - name: Lint
        run: deno lint supabase/functions scripts

      - name: Type-check
        run: deno check supabase/functions/*/index.ts scripts/*.ts

      # --allow-env: os testes de CORS mexem em ALLOWED_ORIGINS.
      - name: Testes unitários
        run: deno test --allow-env supabase/functions/_shared/

  # ---------------------------------------------------------------------
  # Vulnerabilidades conhecidas nas dependências.
  #
  # Job próprio porque é o único que pode falhar por motivo de fora: uma
  # CVE publicada hoje quebra o build de um código que não mudou. Ver
  # vermelho aqui e verde no resto diz exatamente isso.
  #
  # O portão é `high`: as duas moderadas que sobram são do
  # react-router-dom (open redirect com contrabarra em <Link>), cuja
  # correção exige major e vai em PR próprio. Era este job que faltava
  # quando duas CVEs críticas de RCE ficaram meses nas devDependencies.
  # ---------------------------------------------------------------------
  audit:
    name: Dependências (npm audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Relatório completo (não falha)
        run: npm audit --prefix web || true

      - name: Falhar em high ou critical
        run: npm audit --prefix web --audit-level=high

  web:
    name: App web (build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Instalar dependências
        run: npm ci --prefix web

      - name: Type-check
        run: npm run typecheck --prefix web

      # Validação dos campos, tradução dos erros do banco e o destino
      # pós-login: o que a revisão apontou como sem cobertura nenhuma.
      - name: Testes de unidade
        run: npm test --prefix web

      # O mesmo comando que a Vercel roda: se quebrar aqui, quebra lá.
      - name: Build
        env:
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_ANON_KEY: ci-placeholder
        run: npm run build --prefix web

  database:
    name: Banco (migrations + fluxo da fila)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: neqst
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v7

      - name: Instalar psql
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Migrations + testes funcionais
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/neqst
        run: scripts/test-sql.sh

      - name: db/full_setup.sql está em dia com as migrations
        run: |
          scripts/build-full-setup.sh
          git diff --exit-code db/full_setup.sql \
            || { echo "::error::db/full_setup.sql desatualizado — rode scripts/build-full-setup.sh"; exit 1; }

      # O arquivo que se cola no SQL Editor do Supabase. Estar em dia com
      # as migrations não garante que ele RODA: já aconteceu de uma
      # resolução feita à mão quebrar com "syntax error" na linha 8027,
      # com as migrations todas passando. Então ele é aplicado de
      # verdade, num banco limpo — e duas vezes, porque é idempotente.
      - name: db/full_setup.sql aplica num banco limpo (duas vezes)
        env:
          PGPASSWORD: postgres
          PSQL: psql -h localhost -U postgres -v ON_ERROR_STOP=1 -q
        run: |
          $PSQL -d postgres -c 'create database neqst_full;'
          $PSQL -d neqst_full -f tests/local/00_supabase_stub.sql
          $PSQL -d neqst_full -f db/full_setup.sql
          $PSQL -d neqst_full -f db/full_setup.sql
