# Configuração do Supabase CLI — ambiente local (supabase start)
project_id = "neqst"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[db.pooler]
enabled = false

[realtime]
enabled = true

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[auth]
enabled = true
site_url = "neqst://auth-callback"
additional_redirect_urls = ["neqst://auth-callback", "exp://127.0.0.1:19000"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true

[auth.email]
enable_signup = true
enable_confirmations = false
double_confirm_changes = true

# US-01 — SSO obrigatório para publicação nas lojas.
[auth.external.google]
enabled = true
client_id = "env(SUPABASE_AUTH_GOOGLE_CLIENT_ID)"
secret = "env(SUPABASE_AUTH_GOOGLE_SECRET)"
skip_nonce_check = false

[auth.external.apple]
enabled = true
client_id = "env(SUPABASE_AUTH_APPLE_CLIENT_ID)"
secret = "env(SUPABASE_AUTH_APPLE_SECRET)"

[edge_runtime]
enabled = true
policy = "oneshot"

[functions.scan-court]
verify_jwt = true

[functions.join-queue]
verify_jwt = true

[functions.leave-queue]
verify_jwt = true

[functions.queue-status]
verify_jwt = false

[functions.call-next]
verify_jwt = true

[functions.register-push-token]
verify_jwt = true

[functions.admin-court-qr]
verify_jwt = true

# Chamada por cron com header x-cron-secret, sem JWT de usuário.
[functions.dispatch-notifications]
verify_jwt = false
